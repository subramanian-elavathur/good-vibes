version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      # One pull request for all minor and patch updates of dev tooling
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Keep the Node.js types in line with the oldest supported Node.js version
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
