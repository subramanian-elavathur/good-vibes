# Publishes the package to npm and GitHub Packages when a release is published.
# Bump "version" in package.json before creating the release.
#
# npm authenticates with trusted publishing (OIDC), configured for this
# repository and workflow file in the package settings on npmjs.com, so no npm
# token is needed. It also signs the package with provenance.
name: Publish

on:
  release:
    types: [published]

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm test
      - run: npm publish

  publish-gpr:
    needs: publish-npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://npm.pkg.github.com
      - run: npm ci
      # GitHub Packages only supports scoped packages
      - run: npm pkg set name=@subramanian-elavathur/good-vibes
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
